<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trip-compass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- header -->
    <header class="l-header">
      <div class="l-header__inner">
        <h1 class="l-header__logo">
          <a href="/" class="l-header__logoLink">
            <img src="/src/assets/common/logo.png" alt="Trip Compassのロゴ" />
            <span class="l-header__logoText">Trip Compass</span>
          </a>
        </h1>
        <nav class="l-header__nav">
          <ul class="l-header__navList">
            <li class="l-header__navItem">
              <a href="/diagnosis" class="l-header__navLink">旅先診断</a>
            </li>
            <li class="l-header__navItem">
              <a href="/create" class="l-header__navLink">しおりを作成</a>
            </li>
            <li class="l-header__navItem">
              <a href="/itineraries" class="l-header__navLink"
                >みんなのしおり</a
              >
            </li>
            <li class="l-header__navItem">
              <a href="my-itineraries" class="l-header__navLink"
                >自分のしおり</a
              >
            </li>
          </ul>
        </nav>
        <a href="/auth" class="l-header__button">
          <span class="l-header__buttonText">ログイン / 新規登録</span>
          <span class="l-header__buttonIcon">
            <img src="/src/assets/common/account-icon-white.svg" />
          </span>
        </a>
      </div>
    </header>
    <!-- ./ header -->

    <main class="p-auth">
      <section class="l-section">
        <div class="l-inner u-narrow">
          <hgroup class="c-title__box u-ta-center">
            <h2 class="c-title u-ta-center">ログイン／新規登録</h2>
          </hgroup>

          <form action="" method="post" class="p-auth__form">
            <div class="p-auth__fieldList">
              <label for="username" class="p-auth__field">
                <span class="p-auth__label">ユーザー名</span>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="p-auth__input"
                  placeholder="例: trip_taro"
                  autocomplete="username"
                  required
                />
              </label>
              <label for="email" class="p-auth__field">
                <span class="p-auth__label">メールアドレス</span>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="p-auth__input"
                  placeholder="例: taro@example.com"
                  autocomplete="email"
                  required
                />
              </label>
              <label for="password" class="p-auth__field">
                <span class="p-auth__label">パスワード</span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="p-auth__input"
                  placeholder="パスワードを入力"
                  autocomplete="new-password"
                  required
                />
              </label>
            </div>
            <button type="submit" class="p-auth__button">新規登録する</button>
          </form>

          <p class="p-auth__note">
            ユーザー名、メールアドレス、パスワードはすべて入力必須です。
          </p>
        </div>
      </section>

      <!-- follow us
      <section class="l-follow">
        <div class="l-inner">
          <hgroup class="c-title__box">
            <h3 class="c-title l-follow__title">Follow Us</h3>
          </hgroup>
          <ul class="l-follow__list">
            <li class="l-follow__item">
              <a href="" class="l-follow__link">
                <img
                  src="/src/assets/common/instagram-icon.svg"
                  alt="インスタグラムロゴ"
                />
              </a>
            </li>
            <li class="l-follow__item">
              <a href="" class="l-follow__link">
                <img src="/src/assets/common/x-icon.png" alt="xロゴ" />
              </a>
            </li>
          </ul>
        </div>
      </section>
      follow us -->
    </main>

    <!-- footer -->
    <footer class="l-footer">
      <div class="l-inner">
        <div class="l-footer__topList">
          <img src="/src/assets/common/logo.png" alt="Trip-compassロゴ" />
          <nav class="l-footer__nav">
            <ul class="l-footer__navList">
              <li class="l-footer__navItem">
                <a href="/" class="l-footer__navLink">ホーム</a>
              </li>
              <li class="l-footer__navItem">
                <a href="/diagnosis" class="l-footer__navLink">旅先診断</a>
              </li>
              <li class="l-footer__navItem">
                <a href="/create" class="l-footer__navLink">しおりを作成</a>
              </li>
              <li class="l-footer__navItem">
                <a href="/itineraries" class="l-footer__navLink"
                  >みんなのしおり</a
                >
              </li>
              <li class="l-footer__navItem">
                <a href="/my-itineraries" class="l-footer__navLink"
                  >自分のしおり</a
                >
              </li>
            </ul>
          </nav>
        </div>
        <div class="l-footer__bottomList">
          <p class="l-footer__copy">
            <small>&copy; 2026 Trip Compass by Yuto Takabayashi.</small>
          </p>
          <nav class="l-footer__bottomNav">
            <ul class="l-footer__bottomNavList">
              <li class="l-footer__bottomNavItem">
                <a href="/about" class="l-footer__bottomNavLink"
                  >このサイトについて</a
                >
              </li>
              <li class="l-footer__bottomNavItem">
                <a href="/contact" class="l-footer__bottomNavLink"
                  >お問い合わせ</a
                >
              </li>
              <li class="l-footer__bottomNavItem">
                <a href="/terms" class="l-footer__bottomNavLink">利用規約</a>
              </li>
              <li class="l-footer__bottomNavItem">
                <a href="/privacy-policy" class="l-footer__bottomNavLink"
                  >プライバシーポリシー</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </footer>
    <!-- ./ footer -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
